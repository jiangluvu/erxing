<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
    body { font-family: 'Space Grotesk', -apple-system, 'PingFang SC', sans-serif; background-color: #0c0c0e; color: #f5dddb; margin: 0; }
    i[data-lucide] { display: inline-block; vertical-align: middle; width: 18px; height: 18px; stroke-width: 2; }
</style>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "bg-main": "#0c0c0e", "bg-sidebar": "#1a1a1a", "bg-card": "#161618",
                    "border-default": "#2a2a2a", "brand-pink": "#ec4899", "brand-tertiary": "#52dea2"
                }
            }
        }
    };
</script>
</head>
<body class="flex min-h-screen">
<!-- SideNavBar -->
<aside class="fixed left-0 top-0 h-full w-[240px] bg-[#1a1a1a] border-r border-[#2a2a2a] flex flex-col z-50">
<div class="p-6">
<h2 class="text-xs font-medium text-slate-500 mb-6">欢迎 耳行 新用户!</h2>
<div class="flex items-center gap-3 mb-8">
<span class="text-2xl font-black text-brand-pink">耳行</span>
<span class="bg-brand-pink/10 text-brand-pink text-[10px] px-2 py-0.5 rounded-full font-bold">PRO</span>
</div>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./web.html">
<i data-lucide="sparkles"></i><span>新播客</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./search.html">
<i data-lucide="search"></i><span>全局搜索</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./my-podcasts.html">
<i data-lucide="library"></i><span class="flex-1">我的播客</span><span class="text-[10px] text-slate-500">(3)</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="#">
<i data-lucide="headphones"></i><span>产出物</span>
</a>
</nav>
<div class="mt-8">
<h3 class="px-3 text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-2">探索</h3>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./subscriptions.html">
<i data-lucide="rss"></i><span>订阅</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./hot.html">
<i data-lucide="flame"></i><span>热门</span>
</a>
</nav>
</div>
</div>
<div class="mt-auto p-4 border-t border-[#2a2a2a]">
<button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
<i data-lucide="log-in"></i><span>注册 / 登录</span>
</button>
</div>
</aside>

<!-- Main Content -->
<main class="ml-[240px] flex-1 flex items-center justify-center p-10">
<div class="w-full max-w-sm">
<!-- Logo -->
<div class="text-center mb-8">
<div class="text-3xl font-black text-brand-pink mb-2">耳行</div>
<p class="text-sm text-slate-500">登录以同步你的播客与收藏</p>
</div>

<!-- Login Form -->
<div class="bg-[#161618] border border-[#2a2a2a] rounded-2xl p-6 mb-4">
<div class="space-y-4">
<div>
<label class="block text-xs font-medium text-slate-400 mb-1.5">邮箱</label>
<div class="flex items-center gap-3 bg-[#1a1a1c] border border-[#2a2a2a] rounded-xl px-4 py-3 focus-within:border-brand-pink/50 transition-colors">
<i data-lucide="mail" class="text-slate-500" style="width:16px;height:16px"></i>
<input type="email" placeholder="your@email.com" class="w-full bg-transparent text-sm text-white placeholder-slate-600 outline-none"/>
</div>
</div>
<div>
<label class="block text-xs font-medium text-slate-400 mb-1.5">密码</label>
<div class="flex items-center gap-3 bg-[#1a1a1c] border border-[#2a2a2a] rounded-xl px-4 py-3 focus-within:border-brand-pink/50 transition-colors">
<i data-lucide="lock" class="text-slate-500" style="width:16px;height:16px"></i>
<input type="password" placeholder="输入密码" class="w-full bg-transparent text-sm text-white placeholder-slate-600 outline-none"/>
</div>
</div>
<button class="w-full py-3 bg-white text-black rounded-xl text-sm font-bold hover:bg-white/90 transition-all">
登录
</button>
</div>
<div class="flex items-center gap-3 my-4">
<div class="flex-1 h-px bg-[#2a2a2a]"></div>
<span class="text-xs text-slate-500">或</span>
<div class="flex-1 h-px bg-[#2a2a2a]"></div>
</div>
<button class="w-full flex items-center justify-center gap-2 py-3 bg-white/5 border border-white/5 rounded-xl text-sm text-white hover:bg-white/10 transition-all">
<i data-lucide="github" style="width:16px;height:16px"></i>
<span>使用 GitHub 登录</span>
</button>
</div>

<!-- Toggle -->
<div class="text-center text-xs text-slate-500">
还没有账号？<a href="#" class="text-brand-pink hover:underline">立即注册</a>
</div>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
