<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
    body { font-family: 'Space Grotesk', -apple-system, 'PingFang SC', sans-serif; background-color: #0c0c0e; color: #f5dddb; margin: 0; }
    i[data-lucide] { display: inline-block; vertical-align: middle; width: 18px; height: 18px; stroke-width: 2; }
</style>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "bg-main": "#0c0c0e", "bg-sidebar": "#1a1a1a", "bg-card": "#161618",
                    "border-default": "#2a2a2a", "brand-pink": "#ec4899", "brand-tertiary": "#52dea2"
                }
            }
        }
    };
</script>
</head>
<body class="flex min-h-screen">
<!-- SideNavBar -->
<aside class="fixed left-0 top-0 h-full w-[240px] bg-[#1a1a1a] border-r border-[#2a2a2a] flex flex-col z-50">
<div class="p-6">
<h2 class="text-xs font-medium text-slate-500 mb-6">欢迎 耳行 新用户!</h2>
<div class="flex items-center gap-3 mb-8">
<span class="text-2xl font-black text-brand-pink">耳行</span>
<span class="bg-brand-pink/10 text-brand-pink text-[10px] px-2 py-0.5 rounded-full font-bold">PRO</span>
</div>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./web.html">
<i data-lucide="sparkles"></i><span>新播客</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-white bg-white/5 font-medium" href="#">
<i data-lucide="search" class="text-brand-pink"></i><span>全局搜索</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./my-podcasts.html">
<i data-lucide="library"></i><span class="flex-1">我的播客</span><span class="text-[10px] text-slate-500">(3)</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="#">
<i data-lucide="headphones"></i><span>产出物</span>
</a>
</nav>
<div class="mt-8">
<h3 class="px-3 text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-2">探索</h3>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./subscriptions.html">
<i data-lucide="rss"></i><span>订阅</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./hot.html">
<i data-lucide="flame"></i><span>热门</span>
</a>
</nav>
</div>
</div>
<div class="mt-auto p-4 border-t border-[#2a2a2a]">
<button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
<i data-lucide="log-in"></i><span>注册 / 登录</span>
</button>
</div>
</aside>

<!-- Main Content -->
<main class="ml-[240px] flex-1 p-10">
<div class="max-w-3xl mx-auto">
<h1 class="text-2xl font-bold text-white mb-2">全局搜索</h1>
<p class="text-sm text-slate-500 mb-6">搜索你生成的播客、订阅源或推荐内容</p>

<!-- Search Input -->
<div class="bg-[#161618] border border-[#2a2a2a] rounded-2xl p-1 flex items-center gap-2 mb-8 accent-glow">
<div class="flex-1 flex items-center gap-3 px-4">
<i data-lucide="search" class="text-slate-500" style="width:18px;height:18px"></i>
<input type="text" placeholder="输入关键词搜索…" class="w-full bg-transparent text-sm text-white placeholder-slate-600 outline-none py-3" value="AI"/>
</div>
<button class="px-5 py-2.5 bg-white text-black rounded-xl text-sm font-bold hover:bg-white/90 transition-all">
搜索
</button>
</div>

<!-- Results -->
<div class="space-y-8">
<!-- Section: Podcasts -->
<div>
<div class="flex items-center gap-2 mb-3">
<i data-lucide="library" class="text-brand-pink" style="width:16px;height:16px"></i>
<h2 class="text-sm font-semibold text-white">播客</h2>
<span class="text-xs text-slate-500">2 个结果</span>
</div>
<div class="space-y-2">
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all cursor-pointer">
<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-pink/20 to-brand-tertiary/20 flex items-center justify-center flex-shrink-0">
<i data-lucide="headphones" class="text-brand-pink" style="width:20px;height:20px"></i>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-sm font-semibold text-white truncate">AI 时代的数字生活变革</h3>
<p class="text-xs text-slate-500 mt-0.5">公众号 · 12 分钟 · 3 天前</p>
</div>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-all">
<i data-lucide="play" style="width:16px;height:16px"></i>
</button>
</div>
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all cursor-pointer">
<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-brand-pink/20 to-brand-tertiary/20 flex items-center justify-center flex-shrink-0">
<i data-lucide="headphones" class="text-brand-pink" style="width:20px;height:20px"></i>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-sm font-semibold text-white truncate">DeepSeek 崛起：中国 AI 的新格局</h3>
<p class="text-xs text-slate-500 mt-0.5">知乎 · 15 分钟 · 1 周前</p>
</div>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-all">
<i data-lucide="play" style="width:16px;height:16px"></i>
</button>
</div>
</div>
</div>

<!-- Section: Articles -->
<div>
<div class="flex items-center gap-2 mb-3">
<i data-lucide="file-text" class="text-brand-tertiary" style="width:16px;height:16px"></i>
<h2 class="text-sm font-semibold text-white">文章</h2>
<span class="text-xs text-slate-500">1 个结果</span>
</div>
<div class="bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all cursor-pointer">
<div class="flex items-center gap-3 mb-2">
<span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-500 border border-white/5">公众号</span>
<span class="text-xs text-slate-500">晚点LatePost</span>
</div>
<h3 class="text-sm font-semibold text-white mb-1">AI 教育变革：重新定义学习</h3>
<p class="text-xs text-slate-500 line-clamp-2">深度探讨了 AI 对教育体系的影响，从个性化学习到智能评估…</p>
</div>
</div>

<!-- Section: Subscriptions -->
<div>
<div class="flex items-center gap-2 mb-3">
<i data-lucide="rss" class="text-[#5E9EFF]" style="width:16px;height:16px"></i>
<h2 class="text-sm font-semibold text-white">订阅源</h2>
<span class="text-xs text-slate-500">1 个结果</span>
</div>
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all cursor-pointer">
<div class="w-10 h-10 rounded-xl bg-brand-pink/10 flex items-center justify-center flex-shrink-0">
<i data-lucide="message-square" class="text-brand-pink" style="width:18px;height:18px"></i>
</div>
<div class="flex-1 min-w-0">
<h3 class="text-sm font-semibold text-white">晚点LatePost</h3>
<p class="text-xs text-slate-500">公众号 · 共生成 12 期播客</p>
</div>
</div>
</div>
</div>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
