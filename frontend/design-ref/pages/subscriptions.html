<!DOCTYPE html>
<html class="dark" lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
    body { font-family: 'Space Grotesk', -apple-system, 'PingFang SC', sans-serif; background-color: #0c0c0e; color: #f5dddb; margin: 0; }
    i[data-lucide] { display: inline-block; vertical-align: middle; width: 18px; height: 18px; stroke-width: 2; }
</style>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "bg-main": "#0c0c0e", "bg-sidebar": "#1a1a1a", "bg-card": "#161618",
                    "border-default": "#2a2a2a", "brand-pink": "#ec4899", "brand-tertiary": "#52dea2"
                }
            }
        }
    };
</script>
</head>
<body class="flex min-h-screen">
<!-- SideNavBar -->
<aside class="fixed left-0 top-0 h-full w-[240px] bg-[#1a1a1a] border-r border-[#2a2a2a] flex flex-col z-50">
<div class="p-6">
<h2 class="text-xs font-medium text-slate-500 mb-6">欢迎 播刻 新用户!</h2>
<div class="flex items-center gap-3 mb-8">
<span class="text-2xl font-black text-brand-pink">播刻</span>
<span class="bg-brand-pink/10 text-brand-pink text-[10px] px-2 py-0.5 rounded-full font-bold">PRO</span>
</div>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./web.html">
<i data-lucide="sparkles"></i><span>新播客</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="#">
<i data-lucide="search"></i><span>全局搜索</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="./my-podcasts.html">
<i data-lucide="library"></i><span class="flex-1">我的播客</span><span class="text-[10px] text-slate-500">(3)</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="#">
<i data-lucide="headphones"></i><span>产出物</span>
</a>
</nav>
<div class="mt-8">
<h3 class="px-3 text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-2">探索</h3>
<nav class="space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-white bg-white/5 font-medium" href="./subscriptions.html">
<i data-lucide="rss" class="text-brand-pink"></i><span>订阅</span>
</a>
<a class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-white/5 transition-all" href="#">
<i data-lucide="flame"></i><span>热门</span>
</a>
</nav>
</div>
</div>
<div class="mt-auto p-4 border-t border-[#2a2a2a]">
<button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-sm font-medium transition-all">
<i data-lucide="log-in"></i><span>注册 / 登录</span>
</button>
</div>
</aside>

<!-- Main Content -->
<main class="ml-[240px] flex-1 p-10">
<div class="max-w-3xl mx-auto">
<div class="mb-8">
<h1 class="text-2xl font-bold text-white">内容源订阅</h1>
<p class="text-sm text-slate-500 mt-1">订阅你关注的内容源，自动同步生成播客</p>
</div>

<!-- Add Subscription Input -->
<div class="bg-[#161618] border border-[#2a2a2a] rounded-2xl p-1 flex items-center gap-2 mb-8 accent-glow">
<div class="flex-1 flex items-center gap-3 px-4">
<i data-lucide="link" class="text-slate-500" style="width:16px;height:16px"></i>
<input type="text" placeholder="粘贴公众号 / B站 / 知乎 / RSS 链接…" class="w-full bg-transparent text-sm text-white placeholder-slate-600 outline-none py-3"/>
</div>
<button class="px-5 py-2.5 bg-white text-black rounded-xl text-sm font-bold hover:bg-white/90 transition-all">
订阅
</button>
</div>

<!-- Subscription List -->
<div class="space-y-3">
<!-- Item 1 -->
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all">
<div class="w-10 h-10 rounded-xl bg-brand-pink/10 flex items-center justify-center flex-shrink-0">
<i data-lucide="message-square" class="text-brand-pink" style="width:18px;height:18px"></i>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<h3 class="text-sm font-semibold text-white truncate">晚点LatePost</h3>
<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-slate-500 border border-white/5">公众号</span>
</div>
<p class="text-xs text-slate-500">上次生成：2026-05-03 · 共生成 12 期播客</p>
</div>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="flex items-center gap-1 text-[10px] text-brand-tertiary"><span class="w-1.5 h-1.5 rounded-full bg-brand-tertiary"></span>自动同步中</span>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-all">
<i data-lucide="settings-2" style="width:14px;height:14px"></i>
</button>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-red-400 transition-all">
<i data-lucide="trash-2" style="width:14px;height:14px"></i>
</button>
</div>
</div>
<!-- Item 2 -->
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all">
<div class="w-10 h-10 rounded-xl bg-[#5E9EFF]/10 flex items-center justify-center flex-shrink-0">
<i data-lucide="play-circle" class="text-[#5E9EFF]" style="width:18px;height:18px"></i>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<h3 class="text-sm font-semibold text-white truncate">影视飓风</h3>
<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-slate-500 border border-white/5">B站</span>
</div>
<p class="text-xs text-slate-500">上次生成：2026-05-02 · 共生成 8 期播客</p>
</div>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="flex items-center gap-1 text-[10px] text-brand-tertiary"><span class="w-1.5 h-1.5 rounded-full bg-brand-tertiary"></span>自动同步中</span>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-all">
<i data-lucide="settings-2" style="width:14px;height:14px"></i>
</button>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-red-400 transition-all">
<i data-lucide="trash-2" style="width:14px;height:14px"></i>
</button>
</div>
</div>
<!-- Item 3 (Paused) -->
<div class="flex items-center gap-4 bg-[#161618] border border-[#2a2a2a] rounded-2xl p-4 hover:border-white/10 transition-all">
<div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center flex-shrink-0">
<i data-lucide="file-text" class="text-slate-500" style="width:18px;height:18px"></i>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<h3 class="text-sm font-semibold text-white truncate">知乎日报</h3>
<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-slate-500 border border-white/5">知乎</span>
</div>
<p class="text-xs text-slate-500">上次生成：2026-04-28 · 共生成 3 期播客</p>
</div>
<div class="flex items-center gap-2 flex-shrink-0">
<span class="flex items-center gap-1 text-[10px] text-slate-500"><span class="w-1.5 h-1.5 rounded-full bg-slate-500"></span>已暂停</span>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-white transition-all">
<i data-lucide="settings-2" style="width:14px;height:14px"></i>
</button>
<button class="p-2 rounded-lg hover:bg-white/5 text-slate-500 hover:text-red-400 transition-all">
<i data-lucide="trash-2" style="width:14px;height:14px"></i>
</button>
</div>
</div>
</div>

<!-- Empty State (hidden) -->
<div class="hidden flex flex-col items-center justify-center py-24 text-center">
<div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center mb-4">
<i data-lucide="rss" class="text-slate-600" style="width:28px;height:28px"></i>
</div>
<h3 class="text-white font-semibold mb-1">还没有订阅</h3>
<p class="text-sm text-slate-500 mb-6">订阅你喜欢的内容源，播刻会自动为你生成播客</p>
</div>
</div>
</main>
<script>lucide.createIcons();</script>
</body>
</html>
