<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳行 — 通勤路上听播客</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F5F7;--card:#FFF;--primary:#5E9EFF;--accent:#FF6B6B;--text:#1D1D1F;--text2:#86868B;--text3:#C7C7CC;--border:rgba(0,0,0,.04);--r:10px;--sidebar:240px}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== LAYOUT ===== */
.app{display:flex;height:100vh}
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* ===== SIDEBAR ===== */
.sidebar{width:var(--sidebar);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:0 8px}
.sidebar .logo{display:flex;align-items:center;gap:8px;padding:16px 12px 20px;text-decoration:none}
.sidebar .logo .icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700}
.sidebar .logo .name{font-size:18px;font-weight:700}
.nav-group{font-size:11px;font-weight:600;color:var(--text2);padding:16px 12px 6px;letter-spacing:.3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 0;border-radius:8px;font-size:14px;font-weight:500;color:#555;cursor:pointer;transition:all .12s;text-decoration:none;border:none;background:transparent;font-family:inherit;width:100%;text-align:left}
.nav-item:hover{background:rgba(0,0,0,.04);color:var(--text)}
.nav-item.active{background:rgba(94,158,255,.08);color:var(--primary);font-weight:600}
.nav-item .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
.sidebar .spacer{flex:1}

/* ===== TOP BAR ===== */
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);flex-shrink:0}
.menu-btn{display:none;width:36px;height:36px;border-radius:50%;border:none;background:transparent;font-size:18px;cursor:pointer;flex-shrink:0;color:#555}
.top .actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.top .actions button{width:36px;height:36px;border-radius:50%;border:none;background:transparent;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;color:#555}
.top .actions button:hover{background:rgba(0,0,0,.04)}

/* ===== CONTENT ===== */
.content{flex:1;overflow-y:auto;padding:20px 24px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.08);border-radius:3px}
.page-title{font-size:22px;font-weight:700;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--text2);margin-bottom:20px}

/* ===== QUICK INPUT ===== */
.quick-input{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 18px;margin-bottom:20px;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 4px rgba(0,0,0,.02)}
.quick-input input{flex:1;background:transparent;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--text)}
.quick-input input::placeholder{color:var(--text3)}
.quick-input .send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--primary));border:none;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.quick-input .send:hover{transform:scale(1.05)}
.quick-input .send:disabled{opacity:.4;pointer-events:none}

/* ===== CARD GRID ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.04);box-shadow:0 1px 4px rgba(0,0,0,.02);transition:all .2s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.06);transform:translateY(-1px)}
.card .thumb{height:140px;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;overflow:hidden}
.card .thumb .play-overlay{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:18px;box-shadow:0 2px 12px rgba(0,0,0,.1);opacity:0;transition:opacity .2s}
.card:hover .thumb .play-overlay{opacity:1}
.card .body{padding:14px 16px 16px}
.card .body h3{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .body p{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.card .body .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .body .meta .tag{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;background:rgba(94,158,255,.1);color:var(--primary)}
.card .body .meta .tag.pink{background:rgba(255,107,107,.1);color:var(--accent)}
.card .body .meta .tag.green{background:rgba(52,199,89,.1);color:#34C759}
.card .body .meta .time{font-size:11px;color:var(--text3);margin-left:auto}
.card .gen-status{position:absolute;bottom:12px;left:12px;font-size:11px;padding:4px 12px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);display:flex;align-items:center;gap:6px}
.card .gen-status .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:pulse 1s ease-in-out infinite}

@keyframes pulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ===== SECTION HEADER ===== */
.section-title{font-size:15px;font-weight:600;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .more{font-size:12px;color:var(--primary);font-weight:500;cursor:pointer;margin-left:auto;text-decoration:none}
.section-title .more:hover{opacity:.8}

/* ===== PLAYER OVERLAY ===== */
.player-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.player-overlay.on{opacity:1;pointer-events:auto}
.player-panel{background:#fff;border-radius:20px;width:90%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.15);padding:0}
.player-panel::-webkit-scrollbar{width:4px}
.player-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.player-header{position:sticky;top:0;background:#fff;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}
.player-header h2{font-size:15px;font-weight:600;flex:1;padding-right:12px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.player-actions{display:flex;gap:4px}
.player-actions button{width:32px;height:32px;border-radius:50%;border:none;background:transparent;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;transition:background .12s}
.player-actions button:hover{background:rgba(0,0,0,.04)}
.player-avatars{display:flex;align-items:center;justify-content:center;gap:48px;padding:20px 0 4px}
.player-avatars>div{text-align:center}
.player-avatars .avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 4px;position:relative}
.player-avatars .avatar.yang{background:#E8EAFF;color:var(--primary)}
.player-avatars .avatar.jiang{background:#F0F0F0;color:#555}
.player-avatars .avatar.speaking::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--primary);animation:pulse 1s ease-in-out infinite}
.player-avatars .name{font-size:12px;color:var(--text2)}
.player-controls{padding:12px 24px 16px}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:6px}
.progress-wrap{height:5px;background:var(--border);border-radius:3px;cursor:pointer;touch-action:none;position:relative}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:3px;position:relative}
.progress-fill::after{content:'';width:12px;height:12px;background:var(--primary);border-radius:50%;position:absolute;right:-6px;top:50%;transform:translateY(-50%)}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:20px;padding:12px 0 4px}
.ctrl-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-size:16px;color:#555;transition:background .12s}
.ctrl-btn:hover{background:rgba(0,0,0,.04)}
.play-btn{width:52px;height:52px;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(255,107,107,.25)}
.play-btn:hover{background:linear-gradient(135deg,var(--accent),var(--primary));transform:scale(1.04)}

/* ===== TRANSCRIPT ===== */
.transcript-section{padding:0 24px 12px}
.transcript-label{font-size:11px;color:var(--text2);font-weight:600;padding:4px 0}
.line-list{max-height:200px;overflow-y:auto;padding:4px 0 8px;scroll-behavior:smooth}
.line-list::-webkit-scrollbar{width:3px}
.line-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.line-item{display:flex;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:2px;font-size:13px;line-height:1.5;transition:all .2s}
.line-item.active{background:rgba(94,158,255,.08);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-weight:500}
.line-speaker{flex-shrink:0;font-size:11px;font-weight:600;min-width:30px}
.line-speaker.yang{color:var(--primary)}
.line-speaker.jiang{color:#888}
.line-text{word-break:break-word;color:#555}
.line-item.active .line-text{color:var(--text)}

/* ===== RECOMMENDATIONS ===== */
.rec-section{display:none;padding:0 24px 16px}
.rec-section.show{display:block}
.rec-section .label{font-size:11px;color:var(--text2);font-weight:600;padding:4px 0}
.rec-list{display:flex;flex-direction:column;gap:6px}
.rec-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;cursor:pointer;transition:all .15s}
.rec-card:active{background:#E8EAFF;border-color:var(--primary)}
.rec-card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-card-summary{font-size:11px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-card-badge{display:inline-block;font-size:10px;color:var(--primary);background:rgba(94,158,255,.1);padding:1px 8px;border-radius:4px;margin-top:4px}

/* ===== DRAWER (mobile) ===== */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:#fff;z-index:61;transform:translateX(-100%);transition:transform .25s;padding:0 8px;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer .drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 20px}
.drawer .drawer-header .logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700}
.drawer .drawer-header .close{width:32px;height:32px;border-radius:50%;border:none;background:transparent;font-size:18px;cursor:pointer;color:#555}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(33,37,41,.92);color:#fff;padding:10px 24px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;z-index:100;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== MOBILE BOTTOM TAB ===== */
.mobile-tab{display:none}
.empty-state{text-align:center;padding:40px 0;color:var(--text2);font-size:14px}

/* ===== SETTINGS ===== */
.dur-btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:#fff;color:#555;cursor:pointer;font-family:inherit}
.dur-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{display:none}
  .menu-btn{display:flex}
  .content{padding:16px}
  .card-grid{grid-template-columns:1fr}
  .top{padding:10px 16px}
  .player-panel{width:100%;max-height:100vh;border-radius:0}
  .mobile-tab{display:flex;position:fixed;bottom:0;left:0;right:0;height:58px;background:rgba(255,255,255,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);justify-content:space-around;align-items:center;padding-bottom:4px;z-index:40}
  .mobile-tab .tab-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--text2);cursor:pointer;padding:4px 12px;background:none;border:none;font-family:inherit}
  .mobile-tab .tab-item i{font-size:18px;font-style:normal}
  .mobile-tab .tab-item.on{color:var(--primary)}
  .content{padding-bottom:76px}
  .line-list{max-height:160px}
}
</style>
</head>
<body>

<div class="app">

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar">
  <a href="/" class="logo">
    <div class="icon">耳</div>
    <div class="name">耳行</div>
  </a>
  <div class="nav-group">主菜单</div>
  <button class="nav-item active" data-page="home"><span class="ic">🏠</span> 首页</button>
  <button class="nav-item" data-page="history"><span class="ic">🕐</span> 历史记录</button>
  <button class="nav-item" data-page="favorites"><span class="ic">⭐</span> 收藏</button>
  <div class="nav-group">其他</div>
  <button class="nav-item" data-page="settings"><span class="ic">⚙️</span> 设置</button>
  <div class="spacer"></div>
</aside>

<!-- ===== MAIN ===== -->
<div class="main">
  <div class="top">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="actions">
      <button id="downloadBtn" title="下载" style="display:none">⬇</button>
    </div>
  </div>

  <div class="content" id="mainContent">
    <!-- HOME -->
    <div id="page-home">
      <h1 class="page-title">首页</h1>
      <p class="page-sub">把文章变成对话，开车也能听</p>
      <div class="quick-input">
        <input id="quickInput" type="text" placeholder="粘贴链接，一键生成车载播客…" autocomplete="off">
        <button class="send" id="sendBtn">→</button>
      </div>
      <div class="section-title">📂 最近生成</div>
      <div class="card-grid" id="recentGrid"></div>
      <div class="section-title" style="margin-top:28px">🔥 热门推荐</div>
      <div class="card-grid" id="hotGrid"></div>
    </div>

    <!-- HISTORY -->
    <div id="page-history" style="display:none">
      <h1 class="page-title">历史记录</h1>
      <p class="page-sub">你听过的播客</p>
      <div class="card-grid" id="historyGrid"></div>
      <div class="empty-state" id="historyEmpty">还没有收听记录</div>
    </div>

    <!-- FAVORITES -->
    <div id="page-favorites" style="display:none">
      <h1 class="page-title">收藏</h1>
      <p class="page-sub">你收藏的播客</p>
      <div class="card-grid" id="favGrid"></div>
      <div class="empty-state" id="favEmpty">还没有收藏的播客</div>
    </div>

    <!-- SETTINGS -->
    <div id="page-settings" style="display:none">
      <h1 class="page-title">设置</h1>
      <p class="page-sub">播客生成偏好</p>
      <div style="background:#fff;border-radius:14px;padding:16px 20px;border:1px solid var(--border)">
        <div style="margin-bottom:16px">
          <div style="font-size:13px;font-weight:600;margin-bottom:6px">播客时长</div>
          <div style="display:flex;gap:8px">
            <button class="dur-btn active" data-dur="short">5分钟</button>
            <button class="dur-btn" data-dur="standard">10分钟</button>
            <button class="dur-btn" data-dur="long">15分钟</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== PLAYER OVERLAY ===== -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-panel">
    <div class="player-header">
      <h2 id="playerTitle">文章播客</h2>
      <div class="player-actions">
        <button id="favToggle" title="收藏">☆</button>
        <button class="close-player" id="closePlayer">✕</button>
      </div>
    </div>
    <div class="player-avatars">
      <div><div class="avatar yang" id="pAv1">🐑</div><div class="name">小羊</div></div>
      <div><div class="avatar jiang" id="pAv2">🐯</div><div class="name">小姜</div></div>
    </div>
    <div class="player-controls">
      <div class="time-row"><span id="curTime">00:00</span><span id="totTime">00:00</span></div>
      <div class="progress-wrap" id="progressWrap"><div class="progress-fill" id="progressFill"></div></div>
      <div class="ctrl-row">
        <button class="ctrl-btn" id="rewindBtn">⏪</button>
        <button class="ctrl-btn play-btn" id="playBtn">▶</button>
        <button class="ctrl-btn" id="forwardBtn">⏩</button>
      </div>
    </div>
    <div class="transcript-section">
      <div class="transcript-label">对话文稿</div>
      <div class="line-list" id="lineList"></div>
    </div>
    <div class="rec-section" id="recSection">
      <div class="label">推荐收听</div>
      <div class="rec-list" id="recList"></div>
    </div>
  </div>
</div>

<!-- ===== DRAWER (mobile) ===== -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="logo"><div class="icon" style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700">耳</div> 耳行</div>
      <button class="close" id="closeDrawer">✕</button>
    </div>
    <div class="nav-group">主菜单</div>
    <button class="nav-item active" data-page="home"><span class="ic">🏠</span> 首页</button>
    <button class="nav-item" data-page="history"><span class="ic">🕐</span> 历史记录</button>
    <button class="nav-item" data-page="favorites"><span class="ic">⭐</span> 收藏</button>
    <div class="nav-group">其他</div>
    <button class="nav-item" data-page="settings"><span class="ic">⚙️</span> 设置</button>
  </div>
</div>

<!-- ===== MOBILE TAB ===== -->
<div class="mobile-tab">
  <button class="tab-item on" data-page="home"><i>🏠</i><span>首页</span></button>
  <button class="tab-item" data-page="history"><i>🕐</i><span>历史</span></button>
  <button class="tab-item" data-page="favorites"><i>⭐</i><span>收藏</span></button>
  <button class="tab-item" data-page="settings"><i>⚙️</i><span>设置</span></button>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
const S = {
  sessionId: null, pollTimer: null, cancelled: false,
  audio: null, isPlaying: false, audioUrl: null, fullAudioUrl: null,
  scriptData: null, timings: [], activeIdx: -1, simTimer: null,
  recTitle: '', recContent: '', recLoaded: false,
  favSessionId: null,
  currentCardEl: null,
  genCards: [],
};

const STATUS = [
  [0, '小羊正在读文章…'],
  [15, '小姜正在做笔记…'],
  [30, '小羊和小姜在讨论…'],
  [50, '小姜在划重点…'],
  [70, '小羊在做总结…'],
  [80, '正在合成语音…'],
  [90, '马上就好了…'],
];

const HOT_DATA = [
  {id:'h1',title:'AI 时代的教育变革：为什么我们需要重新定义学习',desc:'深度探讨了 AI 对教育体系的影响，以及未来学习方式的转变',tag:'精选',gradient:'linear-gradient(135deg,#FF6B6B15,#5E9EFF15)'},

  curPage = page;
  document.querySelectorAll('#mainContent > [id^="page-"]').forEach(el => el.style.display = 'none');
  const target = document.getElementById('page-' + page);
  if (target) target.style.display = 'block';
  document.querySelectorAll('.nav-item, .tab-item').forEach(n => n.classList.toggle('on', n.dataset.page === page));
  document.querySelectorAll('.nav-item, .tab-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  closeDrawer();
}

document.querySelectorAll('.nav-item, .tab-item').forEach(el => {

});

function closeDrawer(){document.getElementById('drawerOverlay').classList.remove('on');document.getElementById('drawer').classList.remove('open')}
document.getElementById('menuBtn').addEventListener('click', openDrawer);
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);

// ============ SETTINGS ============
const DUR_MAP = {short:5,standard:10,long:15};
let selDur = localStorage.getItem('erxing_dur') || 'standard';
document.querySelectorAll('.dur-btn').forEach(b => {
  if(b.dataset.dur===selDur)b.classList.add('active');
  b.addEventListener('click',()=>{
    document.querySelectorAll('.dur-btn').forEach(x=>x.classList.remove('active'));

});

// ============ GENERATION FLOW ============
function genStatusText(progress){
  for(const [p,t] of STATUS)if(progress<=p)return t;
  return '马上就好了…';
}

function createGenCard(input){
  const isUrl = input.startsWith('http://')||input.startsWith('https://');
  const shortTitle = isUrl ? input.split('/').pop().slice(0,30)||'链接' : input.slice(0,40);
  const id = 'gen_'+Date.now();
  const card = document.createElement('div');
  card.className='card';card.id=id;
  card.innerHTML=`<div class="thumb" style="background:linear-gradient(135deg,#5E9EFF15,#FF6B6B15)">
    <span style="font-size:28px">📄</span>
    <div class="gen-status"><span class="dot"></span><span class="status-text">小羊正在读文章…</span></div>
  </div><div class="body"><h3>${shortTitle}</h3><p>正在生成播客…</p>
  <div class="meta"><span class="tag">生成中</span></div></div>`;
  const grid = document.getElementById('recentGrid');
  grid.insertBefore(card, grid.firstChild);
  S.genCards.push(id);
  return card;
}

function updateGenCard(card, progress, statusText){
  const t = card.querySelector('.status-text');
  if(t)t.textContent = statusText || genStatusText(progress);
  const tag = card.querySelector('.tag');
  if(progress>=100&&tag)tag.textContent='已就绪';
  else if(progress>=40&&tag)tag.textContent='可收听';
  // Show play overlay when opening ready
  const thumb = card.querySelector('.thumb');
  if(progress>=40){
    let po = thumb.querySelector('.play-overlay');
    if(!po){po=document.createElement('div');po.className='play-overlay';po.textContent='▶';thumb.appendChild(po);po.style.opacity='1'}
  }
}

function setCardReady(card, title){
  const h3 = card.querySelector('h3');
  if(title&&h3)h3.textContent=title;
  const tag = card.querySelector('.tag');
  if(tag)tag.textContent='已就绪';
  const t = card.querySelector('.status-text');
  if(t)t.textContent='已就绪，点击收听';
  const dot = card.querySelector('.dot');
  if(dot)dot.style.display='none';
  const thumb = card.querySelector('.thumb');
  let po = thumb.querySelector('.play-overlay');
  if(!po){po=document.createElement('div');po.className='play-overlay';po.textContent='▶';thumb.appendChild(po)}
  po.style.opacity='1';
  card.onclick = ()=>{openPlayer();};
}

async function handleSubmit(){
  const input = document.getElementById('quickInput').value.trim();
  if(!input||input.length<5){showToast('请输入链接或文本');return}
  document.getElementById('quickInput').value='';
  const card = createGenCard(input);
  const isUrl = input.startsWith('http://')||input.startsWith('https://');
  const payload = isUrl ? {url:input} : {text:input};
  sessionStorage.setItem('erxing_payload',JSON.stringify(payload));
  await startGen(card, payload);
}

document.getElementById('sendBtn').addEventListener('click', handleSubmit);
document.getElementById('quickInput').addEventListener('keydown', e => {if(e.key==='Enter')handleSubmit()});

// ============ STREAMING GEN ============
async function startGen(card, payload){
  S.cancelled=false;S.recTitle='';S.recContent='';S.recLoaded=false;
  if(S.pollTimer)clearInterval(S.pollTimer);
  const requestId = crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
  try{
    updateGenCard(card,5);
    const r1=await fetch('/api/generate_streaming',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,request_id:requestId,duration:selDur})});
    if(!r1.ok){const e=await r1.json();throw new Error(e.error||'生成失败')}
    S.sessionId=r1.headers.get('X-Session-Id');
    const blob=await r1.blob();
    S.audioUrl=URL.createObjectURL(blob);
    updateGenCard(card,40,'开场已就绪');
    setCardReady(card);
    S.currentCardEl=card;
    startPolling(card);
  }catch(e){
    const st=card.querySelector('.status-text');
    if(st)st.textContent='生成失败';
    const tag=card.querySelector('.tag');
    if(tag){tag.textContent='失败';tag.style.background='rgba(255,107,107,.1)';tag.style.color='var(--accent)'}
    showToast(e.message||'生成失败');
  }
}

function startPolling(card){
  if(!S.sessionId)return;
  if(S.pollTimer)clearInterval(S.pollTimer);
  S.pollTimer=setInterval(async()=>{
    try{
      const r=await fetch('/api/generation_status/'+S.sessionId);
      if(!r.ok){clearInterval(S.pollTimer);return}
      const d=await r.json();
      if(d.status==='failed'){clearInterval(S.pollTimer);showToast('生成失败');return}
      updateGenCard(card,d.progress||0);
      if(d.status==='complete'){
        clearInterval(S.pollTimer);
        setCardReady(card,d.title||null);
        if(d.article_content){S.recTitle=d.article_title||'';S.recContent=d.article_content}
        saveHistory(d.title||'未命名');
        if(S.audio&&S.audio.ended)loadRecommendations();
        downloadFullAudio();
      }
    }catch(e){console.warn('Poll:',e)}
  },3000);
}

function downloadFullAudio(){
  if(!S.sessionId)return;
  fetch('/api/download_podcast/'+S.sessionId).then(r=>{if(!r.ok)return;return r.blob()}).then(blob=>{
    if(!blob)return;
    S.fullAudioUrl=URL.createObjectURL(blob);
    const wasPlaying=S.isPlaying;
    const curT=S.audio?S.audio.currentTime:0;
    const na=new Audio(S.fullAudioUrl);
    na.addEventListener('loadedmetadata',()=>{
      const seek=Math.min(curT,na.duration-1);
      if(seek>0)na.currentTime=seek;
      if(S.audio){S.audio.pause();S.audio.src='';if(S.audioUrl)URL.revokeObjectURL(S.audioUrl)}
      S.audio=na;S.audioUrl=S.fullAudioUrl;
      S.audio.addEventListener('timeupdate',onTimeUpdate);
      S.audio.addEventListener('ended',onEnded);
      document.getElementById('totTime').textContent=formatTime(S.audio.duration);
      if(wasPlaying){S.audio.play().catch(()=>{});document.getElementById('playBtn').textContent='⏸'}
    });
  }).catch(e=>console.warn('Full audio:',e));
}

// ============ PLAYER ============
function openPlayer(){
  if(!S.audioUrl)return;
  document.getElementById('playerOverlay').classList.add('on');
  initPlayer();
}
document.getElementById('closePlayer').addEventListener('click', closePlayer);
document.getElementById('playerOverlay').addEventListener('click', e => {if(e.target===e.currentTarget)closePlayer()});

function closePlayer(){
  document.getElementById('playerOverlay').classList.remove('on');
  if(S.audio){S.audio.pause()}
  S.isPlaying=false;
  document.getElementById('playBtn').textContent='▶';
  stopAvatarAnim();
}

function initPlayer(){
  const list=document.getElementById('lineList');
  list.innerHTML='';
  if(S.scriptData&&Array.isArray(S.scriptData)){
    S.scriptData.forEach((item,i)=>{
      const d=document.createElement('div');
      d.className='line-item';d.dataset.index=i;
      d.innerHTML='<span class="line-speaker '+(item.speaker==='小羊'?'yang':'jiang')+'">'+item.speaker+'</span><span class="line-text">'+item.text+'</span>';
      list.appendChild(d);
    });
    S.timings=[];let acc=0;
    S.scriptData.forEach(item=>{const dur=Math.max(1.5,item.text.length/4);S.timings.push({start:acc,end:acc+dur});acc+=dur});
  }else{
    const d=document.createElement('div');d.className='line-item';
    d.innerHTML='<span class="line-text" style="color:var(--text2)">文稿加载中…</span>';
    list.appendChild(d);S.timings=[];
  }
  if(S.audio){S.audio.pause()}
  S.audio=new Audio(S.audioUrl);
  document.getElementById('totTime').textContent='00:00';
  S.audio.addEventListener('loadedmetadata',()=>{document.getElementById('totTime').textContent=formatTime(S.audio.duration)});
  S.audio.addEventListener('timeupdate',onTimeUpdate);
  S.audio.addEventListener('ended',onEnded);
  S.audio.addEventListener('error',()=>{if(!S.audio.src||S.audio.error)startSimulation()});
  setTimeout(()=>{if(!S.audio.duration)document.getElementById('totTime').textContent=formatTime(acc||120)},2000);
  document.getElementById('playBtn').onclick=togglePlay;
  document.getElementById('rewindBtn').onclick=()=>{if(S.audio.currentTime)S.audio.currentTime=Math.max(0,S.audio.currentTime-15)};
  document.getElementById('forwardBtn').onclick=()=>{if(S.audio.currentTime)S.audio.currentTime=Math.min(S.audio.duration||120,S.audio.currentTime+15)};
  // Progress seek
  const pw=document.getElementById('progressWrap');
  pw.onmousedown=pw.ontouchstart=function(e){
    const rect=pw.getBoundingClientRect();
    const x=e.touches?e.touches[0].clientX:e.clientX;
    const p=Math.max(0,Math.min(1,(x-rect.left)/rect.width));
    document.getElementById('progressFill').style.width=(p*100)+'%';
    if(S.audio.duration)S.audio.currentTime=p*S.audio.duration;
    document.getElementById('curTime').textContent=formatTime(p*(S.audio.duration||120));
    const onMove=(e)=>{const x2=e.touches?e.touches[0].clientX:e.clientX;const p2=Math.max(0,Math.min(1,(x2-rect.left)/rect.width));
      document.getElementById('progressFill').style.width=(p2*100)+'%';if(S.audio.duration)S.audio.currentTime=p2*S.audio.duration;
      document.getElementById('curTime').textContent=formatTime(p2*(S.audio.duration||120))};
    const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
      document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp)};
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:true});document.addEventListener('touchend',onUp);
  };
  // Fav toggle
  document.getElementById('favToggle').onclick=toggleFav;
  updateFavBtn();
  document.getElementById('downloadBtn').style.display=S.sessionId?'inline-flex':'none';
}

function togglePlay(){
  if(!S.audio)return;
  if(S.isPlaying){S.audio.pause();document.getElementById('playBtn').textContent='▶';stopAvatarAnim()}
  else{S.audio.play().catch(()=>startSimulation());document.getElementById('playBtn').textContent='⏸';startAvatarAnim()}
  S.isPlaying=!S.isPlaying;
}

function onTimeUpdate(){
  if(!S.audio||!S.audio.duration)return;
  const p=(S.audio.currentTime/S.audio.duration)*100;
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('curTime').textContent=formatTime(S.audio.currentTime);
  if(S.scriptData)updateHighlight(S.audio.currentTime);
}

function onEnded(){
  S.isPlaying=false;
  document.getElementById('playBtn').textContent='▶';
  stopAvatarAnim();
  tryLoadRecs();
}

let recRetries=0;
function tryLoadRecs(){
  if(S.recContent||S.recTitle){loadRecommendations();return}
  if(recRetries<3){recRetries++;setTimeout(tryLoadRecs,3000)}
}
recRetries=0;

function updateHighlight(time){
  if(!S.scriptData||!S.timings.length)return;
  const idx=S.timings.findIndex(t=>time>=t.start&&time<t.end);
  if(idx===S.activeIdx||idx<0)return;
  S.activeIdx=idx;
  document.querySelectorAll('.line-item').forEach((el,i)=>{el.classList.toggle('active',i===idx);if(i===idx)el.scrollIntoView({behavior:'smooth',block:'center'})});
  const sp=S.scriptData[idx].speaker;
  document.getElementById('pAv1').classList.toggle('speaking',sp==='小羊');
  document.getElementById('pAv2').classList.toggle('speaking',sp==='小姜');
}

function startSimulation(){
  if(S.simTimer)return;
  const total=S.timings.length?S.timings[S.timings.length-1].end:120;
  let t=0;
  S.simTimer=setInterval(()=>{
    t+=0.1;if(t>=total){clearInterval(S.simTimer);S.simTimer=null;S.isPlaying=false;
      document.getElementById('playBtn').textContent='▶';stopAvatarAnim();tryLoadRecs();return}
    const p=(t/total)*100;document.getElementById('progressFill').style.width=p+'%';
    document.getElementById('curTime').textContent=formatTime(t);updateHighlight(t);
  },100);
}

let pSpeakInt=null;
function startAvatarAnim(){let s=false;pSpeakInt=setInterval(()=>{s=!s;document.getElementById('pAv1').classList.toggle('speaking',s);document.getElementById('pAv2').classList.toggle('speaking',!s)},1200)}
function stopAvatarAnim(){if(pSpeakInt)clearInterval(pSpeakInt);pSpeakInt=null;document.getElementById('pAv1').classList.remove('speaking');document.getElementById('pAv2').classList.remove('speaking')}

function formatTime(s){if(!s||isNaN(s))return'00:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}

// ============ RECOMMENDATIONS ============
async function loadRecommendations(){
  const sec=document.getElementById('recSection');
  const list=document.getElementById('recList');
  if(!S.recContent&&!S.recTitle){sec.classList.remove('show');return}
  if(S.recLoaded)return;
  try{
    const r=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:S.recTitle,content:S.recContent})});
    if(!r.ok)return;const d=await r.json();
    if(!d.recommendations||!d.recommendations.length){sec.classList.remove('show');return}
    list.innerHTML='';
    d.recommendations.forEach(item=>{
      const ec=document.createElement('div');ec.className='rec-card';
      ec.innerHTML='<div class="rec-card-title">'+item.title+'</div><div class="rec-card-summary">'+item.summary+'</div><span class="rec-card-badge">'+(item.similarity*100).toFixed(0)+'% 相似</span>';
      ec.addEventListener('click',()=>onRecClick(item));list.appendChild(ec);
    });
    sec.classList.add('show');S.recLoaded=true;
  }catch(e){console.warn('Rec error:',e)}
}

function onRecClick(item){
  showToast('加载推荐文章…');
  closePlayer();
  navigate('home');
  document.getElementById('quickInput').value=item.url||(item.title+' '+item.summary);
}

// ============ FAVORITES ============
let favs=JSON.parse(localStorage.getItem('erxing_favs')||'[]');
function toggleFav(){
  if(!S.sessionId)return;
  const idx=favs.indexOf(S.sessionId);
  if(idx>=0){favs.splice(idx,1);document.getElementById('favToggle').textContent='☆'}
  else{favs.push(S.sessionId);document.getElementById('favToggle').textContent='★';document.getElementById('favToggle').style.color='#FF6B6B'}
  localStorage.setItem('erxing_favs',JSON.stringify(favs));
}
function updateFavBtn(){
  document.getElementById('favToggle').textContent=S.sessionId&&favs.includes(S.sessionId)?'★':'☆';
  document.getElementById('favToggle').style.color=S.sessionId&&favs.includes(S.sessionId)?'#FF6B6B':'#555';
}

// ============ HISTORY ============
let history=JSON.parse(localStorage.getItem('erxing_history')||'[]');
function saveHistory(title){
  history.unshift({id:S.sessionId,title:title||'未命名',time:Date.now(),dur:selDur});
  if(history.length>50)history.pop();
  localStorage.setItem('erxing_history',JSON.stringify(history));
  renderHistory();
}
function renderHistory(){
  const grid=document.getElementById('historyGrid');const empty=document.getElementById('historyEmpty');
  if(!history.length){grid.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  grid.innerHTML=history.map(h=>`<div class="card" onclick="restoreSession('${h.id}')"><div class="thumb" style="background:linear-gradient(135deg,#5E9EFF15,#FF6B6B15)"><span style="font-size:28px">📄</span></div><div class="body"><h3>${h.title}</h3><p>${new Date(h.time).toLocaleString('zh-CN')}</p><div class="meta"><span class="tag">${h.dur==='short'?'5分钟':h.dur==='long'?'15分钟':'10分钟'}</span></div></div></div>`).join('');
}
function renderFavs(){
  const grid=document.getElementById('favGrid');const empty=document.getElementById('favEmpty');
  const favHistory=history.filter(h=>favs.includes(h.id));
  if(!favHistory.length){grid.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  grid.innerHTML=favHistory.map(h=>`<div class="card" onclick="restoreSession('${h.id}')"><div class="thumb" style="background:linear-gradient(135deg,#FF6B6B15,#5E9EFF15)"><span style="font-size:28px">⭐</span></div><div class="body"><h3>${h.title}</h3><p>${new Date(h.time).toLocaleString('zh-CN')}</p><div class="meta"><span class="tag pink">收藏</span></div></div></div>`).join('');
}
function restoreSession(id){showToast('历史播客已过期，请重新生成')}

// ============ HOT GRID ============
function renderHot(){
  const grid=document.getElementById('hotGrid');
  grid.innerHTML=HOT_DATA.map(h=>`<div class="card" onclick="showToast('点击首页输入栏生成播客')"><div class="thumb" style="background:${h.gradient}"><span style="font-size:28px">📄</span></div><div class="body"><h3>${h.title}</h3><p>${h.desc}</p><div class="meta"><span class="tag">${h.tag}</span></div></div></div>`).join('');

// ============ TOAST ============
let tt;
function showToast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}

// ============ INIT ============
renderHot();
renderHistory();
renderFavs();
</script>
