<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>耳行 — 通勤路上听播客</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8F9FA;--card:#FFF;--primary:#5865F2;--text:#212529;--text2:#6C757D;--border:#E9ECEF;--r:10px}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ===== INPUT PAGE ===== */
.container{max-width:480px;width:100%;margin:0 auto;padding:0 20px;min-height:100vh;display:flex;flex-direction:column}
.header{text-align:center;padding:40px 0 8px}
.logo{font-size:26px;font-weight:700;color:var(--primary);letter-spacing:1px}
.tagline{font-size:14px;color:var(--text2);margin-top:4px}

.mode-toggle{display:flex;gap:0;margin:20px 0 12px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.mode-btn{flex:1;padding:10px;font-size:14px;font-weight:500;border:none;background:var(--card);color:var(--text2);cursor:pointer}
.mode-btn.active{background:var(--primary);color:#fff}
.panel{display:none}.panel.active{display:block}

.input-area{display:flex;flex-direction:column;gap:12px}
.input-field{width:100%;padding:14px 16px;font-size:15px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--card);color:var(--text);outline:none;min-height:48px;font-family:inherit}
.input-field:focus{border-color:var(--primary)}
.input-field::placeholder{color:var(--text2)}
textarea.input-field{height:180px;resize:none;padding-bottom:28px}
.textarea-wrap{position:relative}
.char-count{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--text2)}

.btn-gen{width:100%;height:52px;font-size:16px;font-weight:500;border:none;border-radius:var(--r);background:var(--primary);color:#fff;cursor:pointer;margin-top:16px}
.btn-gen:active{opacity:.85}
.btn-gen:disabled{opacity:.4;pointer-events:none}

.spacer{flex:1}
.footer{text-align:center;padding:24px 0 20px;font-size:13px;color:var(--text2)}

/* ===== GENERATING / PLAYER ===== */
#pageGen,#pagePlayer{display:none;max-width:480px;width:100%;margin:0 auto;padding:0 20px;min-height:100vh;flex-direction:column}
#pageGen.active,#pagePlayer.active{display:flex}

.gen-header{text-align:center;padding:40px 0 8px}
.gen-header h1{font-size:20px;font-weight:700;color:var(--text)}
.gen-header p{font-size:13px;color:var(--text2);margin-top:4px}

.avatars{display:flex;align-items:center;justify-content:center;gap:48px;padding:20px 0 8px}
.avatars>div{text-align:center}
.avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 4px;position:relative}
.avatar.xiaoyang{background:#E8EAFF;color:var(--primary)}
.avatar.xiaojiang{background:#E9ECEF;color:var(--text)}
.avatar.speaking::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--primary);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:.2}100%{transform:scale(1);opacity:.6}}
.avatar-name{font-size:12px;color:var(--text2)}

.steps{padding:16px 0 4px}
.step{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r)}
.step-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--border);color:var(--text2);transition:all .4s}
.step-icon.active{background:rgba(88,101,242,.12);color:var(--primary);animation:spin 1.2s linear infinite}
.step-icon.done{background:rgba(40,167,69,.12);color:#28A745;animation:none}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.step-text{font-size:14px;color:var(--text2)}
.step-text.active{color:var(--primary);font-weight:600}
.step-text.done{color:#28A745;font-weight:500}

.progress{margin:4px 0 0;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;width:0;background:var(--primary);border-radius:2px}

.gen-actions{text-align:center;padding:20px 0 24px;margin-top:auto}
.gen-actions button{background:none;border:none;font-size:14px;color:var(--text2);cursor:pointer;padding:12px 20px;min-height:44px}
.gen-actions button:active{color:var(--primary)}

.error-box{display:none;background:#FFF0F0;border:1px solid #FFD5D5;border-radius:var(--r);padding:12px 16px;margin:8px 0;font-size:14px;color:#DC3545;text-align:center}
.error-box.show{display:block}

/* ===== PLAYER ===== */
.player-section{background:var(--card);border-radius:14px;padding:20px;border:1px solid var(--border);margin:4px 0}
.time-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.progress-wrap{height:5px;background:var(--border);border-radius:3px;cursor:pointer;touch-action:none;position:relative}
.progress-fill-bar{height:100%;width:0;background:var(--primary);border-radius:3px;position:relative}
.progress-fill-bar::after{content:'';width:12px;height:12px;background:var(--primary);border-radius:50%;position:absolute;right:-6px;top:50%;transform:translateY(-50%)}
.controls{display:flex;align-items:center;justify-content:center;gap:24px;padding:14px 0 4px}
.ctrl-btn{background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6C757D;width:44px;height:44px;font-size:16px}
.ctrl-btn:active{color:var(--primary)}
.play-btn{width:52px;height:52px;background:var(--primary);color:#fff;border-radius:50%;font-size:20px;box-shadow:0 4px 12px rgba(88,101,242,.3)}
.play-btn:active{transform:scale(.94)}

.dialogue-section{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:4px}
.dialogue-label{font-size:12px;color:var(--text2);font-weight:500;padding:4px 0}
.line-list{overflow-y:auto;flex:1;padding:4px 0 16px;scroll-behavior:smooth}
.line-list::-webkit-scrollbar{width:3px}
.line-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.line-item{display:flex;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:14px;line-height:1.5;transition:all .3s}
.line-item.active{background:rgba(88,101,242,.08);border-left:3px solid var(--primary);border-radius:0 8px 8px 0;font-weight:500}
.line-speaker{flex-shrink:0;font-size:12px;font-weight:600;min-width:32px}
.line-speaker.xiaoyang{color:var(--primary)}
.line-speaker.xiaojiang{color:var(--text2)}
.line-text{word-break:break-word;color:var(--text2)}
.line-item.active .line-text{color:var(--text)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(33,37,41,.92);color:#fff;padding:12px 24px;border-radius:var(--r);font-size:14px;opacity:0;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== RECOMMENDATIONS ===== */
#recommendSection{display:none;margin-top:12px}
#recommendSection.show{display:block}
.rec-list{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.rec-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .2s}
.rec-card:active{background:#F0F1FF;border-color:var(--primary)}
.rec-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.4}
.rec-card-summary{font-size:12px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-card-badge{display:inline-block;font-size:10px;color:var(--primary);background:rgba(88,101,242,.1);padding:2px 8px;border-radius:4px;margin-top:6px}
</style>
</head>
<body>

<!-- ============ INPUT PAGE ============ -->
<div class="container" id="pageInput">
  <div class="header">
    <div class="logo">耳行</div>
    <div class="tagline">把文章变成双人对话播客</div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="url">粘贴链接</button>
    <button class="mode-btn" data-mode="text">粘贴文本</button>
  </div>
  <div class="panel active" id="panel-url">
    <div class="input-area"><input class="input-field" id="urlInput" type="url" placeholder="粘贴文章链接，小羊和小姜聊给你听" autocomplete="off"></div>
  </div>
  <div class="panel" id="panel-text">
    <div class="input-area">
      <div class="textarea-wrap">
        <textarea class="input-field" id="textInput" maxlength="10000" placeholder="粘贴你想听的任何文章……"></textarea>
        <span class="char-count" id="charCount">0/10000</span>
      </div>
    </div>
  </div>
  <button class="btn-gen" onclick="startGenerate()">🎙️ 生成播客</button>
  <div class="spacer"></div>
  <div class="footer">随时随地，听你想听</div>
</div>

<!-- ============ GENERATING PAGE ============ -->
<div id="pageGen">
  <div class="gen-header">
    <h1>正在生成播客…</h1>
    <p id="genStatus">准备中</p>
  </div>
  <div class="avatars">
    <div><div class="avatar xiaoyang" id="gAv1">🐑</div><div class="avatar-name">小羊</div></div>
    <div><div class="avatar xiaojiang" id="gAv2">🐯</div><div class="avatar-name">小姜</div></div>
  </div>
  <div class="steps">
    <div class="step" id="s1"><div class="step-icon active" id="i1">📖</div><span class="step-text active" id="t1">生成开场对话…</span></div>
    <div class="step" id="s2"><div class="step-icon" id="i2">💬</div><span class="step-text" id="t2">后台生成完整对话…</span></div>
    <div class="step" id="s3"><div class="step-icon" id="i3">🎙️</div><span class="step-text" id="t3">合成完整语音…</span></div>
  </div>
  <div class="progress"><div class="progress-fill" id="genProgress"></div></div>
  <div class="error-box" id="errorBox"><span id="errorMsg"></span></div>
  <div class="gen-actions" id="genActions">
    <button id="genCancelBtn" onclick="cancelGen()">取消</button>
    <button id="retryBtn" style="display:none;color:var(--primary);font-weight:600" onclick="retryGen()">重试</button>
  </div>
</div>

<!-- ============ PLAYER PAGE ============ -->
<div id="pagePlayer">
  <div class="gen-header" style="padding:24px 0 8px">
    <h1 id="playerTitle" style="font-size:17px">文章播客</h1>
  </div>
  <div class="avatars">
    <div><div class="avatar xiaoyang" id="pAv1">🐑</div><div class="avatar-name" id="pName1">小羊</div></div>
    <div><div class="avatar xiaojiang" id="pAv2">🐯</div><div class="avatar-name" id="pName2">小姜</div></div>
  </div>
  <div class="player-section">
    <div class="time-row"><span id="curTime">00:00</span><span id="totTime">00:00</span></div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-fill-bar" id="progressFill"></div></div>
    <div class="controls">
      <button class="ctrl-btn" id="rewindBtn">⏪</button>
      <button class="ctrl-btn play-btn" id="playBtn">▶</button>
      <button class="ctrl-btn" id="forwardBtn">⏩</button>
    </div>
  </div>
  <div class="dialogue-section">
    <div class="dialogue-label">对话文稿</div>
    <div class="line-list" id="lineList"></div>
  </div>
  <div id="recommendSection">
    <div class="dialogue-label">推荐收听</div>
    <div class="rec-list" id="recList"></div>
  </div>
  <div class="gen-actions"><button onclick="backHome()" style="background:none;border:none;font-size:14px;color:var(--text2);cursor:pointer;padding:12px 20px">← 返回首页</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
let cancelled=false,scriptData=null,audioBlob=null,audioUrl=null;
let sessionId=null,pollTimer=null,fullAudioUrl=null;
let recTitle='',recContent=''; // For recommendations
const BASE='/api';

// ============ INPUT PAGE ============
document.querySelectorAll('.mode-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mode-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('panel-'+b.dataset.mode).classList.add('active');
  });
});
const ti=document.getElementById('textInput'),cc=document.getElementById('charCount');
ti.addEventListener('input',()=>{cc.textContent=ti.value.length+'/10000'});

function showPage(id){
  ['pageInput','pageGen','pagePlayer'].forEach(p=>{
    document.getElementById(p).style.display=(p===id?'flex':'none');
  });
}

function startGenerate(){
  const mode=document.querySelector('.mode-btn.active').dataset.mode;
  let payload={};
  if(mode==='url'){
    const u=document.getElementById('urlInput').value.trim();
    if(!u){showToast('请先输入文章链接');return}
    payload={url:u};
  }else{
    const t=ti.value.trim();
    if(!t||t.length<20){showToast('请粘贴完整文章内容（至少20字）');return}
    payload={text:t};
  }
  sessionStorage.setItem('erxing_payload',JSON.stringify(payload));
  showPage('pageGen');
  startGen();
}

// ============ GENERATING ============
const steps=['i1','t1','i2','t2','i3','t3'];

function setStep(n,state){
  document.getElementById(steps[n*2]).className='step-icon '+state;
  document.getElementById(steps[n*2+1]).className='step-text '+state;
}
function setProgress(p){document.getElementById('genProgress').style.width=p+'%'}
function setStatus(s){document.getElementById('genStatus').textContent=s}
function showError(m){
  document.getElementById('errorMsg').textContent=m;
  document.getElementById('errorBox').classList.add('show');
  document.getElementById('retryBtn').style.display='inline-block';
  document.getElementById('genCancelBtn').textContent='返回首页';
  setStatus('生成失败');
}

let speakInt=null;
function startAvatarAnim(){
  let t=false;
  speakInt=setInterval(()=>{t=!t;document.getElementById('gAv1').classList.toggle('speaking',t);
  document.getElementById('gAv2').classList.toggle('speaking',!t)},1000);
}

async function startGen(){
  cancelled=false;audioBlob=null;audioUrl=null;fullAudioUrl=null;sessionId=null;scriptData=null;
  if(pollTimer)clearInterval(pollTimer);
  if(speakInt)clearInterval(speakInt);
  startAvatarAnim();
  const payload=JSON.parse(sessionStorage.getItem('erxing_payload'));
  if(!payload){showError('缺少输入内容');return}

  const requestId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2);
  document.getElementById('retryBtn').style.display='none';
  document.getElementById('genCancelBtn').textContent='取消';

  try{
    // Single streaming request (replaces 3 sequential calls)
    setStep(0,'active');setStatus('正在生成开场…');setProgress(10);
    const r1=await fetch(BASE+'/generate_streaming',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,request_id:requestId})});
    if(!r1.ok){const e=await r1.json();throw new Error(e.error||'生成失败')}

    sessionId=r1.headers.get('X-Session-Id');
    const ttfa=parseInt(r1.headers.get('X-TTFA-Ms')||'0');
    audioBlob=await r1.blob();
    audioUrl=URL.createObjectURL(audioBlob);

    setStep(0,'done');setProgress(40);
    setStatus('开场已就绪！正在后台生成完整播客…');
    console.log('TTFA: '+ttfa+'ms');

    // Show player with opening audio
    setTimeout(()=>{if(!cancelled)showPlayer()},500);

    // Start polling for full version
    setStep(1,'active');setStatus('正在分析文章内容…');setProgress(45);
    startPolling();
  }catch(e){
    showError(e.message||'生成失败');
  }
}

function startPolling(){
  if(!sessionId)return;
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch(BASE+'/generation_status/'+sessionId);
      if(!r.ok){clearInterval(pollTimer);return}
      const d=await r.json();
      setProgress(Math.max(45,d.progress));
      if(d.status==='complete'){
        clearInterval(pollTimer);
        setStep(1,'done');setStep(2,'done');setProgress(100);
        setStatus('完整播客已就绪！');
        if(d.article_content){recTitle=d.article_title||'';recContent=d.article_content}
        if(d.script&&Array.isArray(d.script)&&d.script.length){
          scriptData=d.script;
          // Rebuild dialogue list with full script
          const list=document.getElementById('lineList');
          list.innerHTML='';
          timings=[];let acc=0;
          scriptData.forEach((item,i)=>{
            const d2=document.createElement('div');
            d2.className='line-item';d2.dataset.index=i;
            d2.innerHTML='<span class="line-speaker '+item.speaker+'">'+item.speaker+'</span><span class="line-text">'+item.text+'</span>';
            list.appendChild(d2);
            const dur=Math.max(1.5,item.text.length/4);
            timings.push({start:acc,end:acc+dur});acc+=dur;
          });
          // Refresh duration display
          const totT=document.getElementById('totTime');
          if(audio&&audio.duration)totT.textContent=formatTime(audio.duration);
          else totT.textContent=formatTime(acc);
        }
        downloadFullAudio();
      }else if(d.status==='failed'){
        clearInterval(pollTimer);
        setStep(1,'done');setStep(2,'done');setProgress(100);
        setStatus('完整版生成遇到问题');
        showToast('完整版生成失败，可稍后重试');
      }else if(d.status==='generating_full'||d.status==='opening_ready'){
        setStep(1,'active');
        setStatus(d.progress<70?'正在分析文章内容…':'正在合成完整语音…');
      }
    }catch(e){console.warn('Poll error:',e)}
  },3000);
}

function cancelGen(){
  cancelled=true;
  if(pollTimer)clearInterval(pollTimer);
  if(speakInt)clearInterval(speakInt);
  backHome();
}

function retryGen(){
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('retryBtn').style.display='none';
  document.getElementById('genCancelBtn').textContent='取消';
  sessionId=null;fullAudioUrl=null;
  if(pollTimer)clearInterval(pollTimer);
  startGen();
}

async function downloadFullAudio(){
  if(!sessionId)return;
  try{
    const r=await fetch(BASE+'/download_podcast/'+sessionId);
    if(!r.ok){return}
    fullAudioUrl=URL.createObjectURL(await r.blob());
    const wasPlaying=isPlaying;
    const curT=audio?audio.currentTime:0;
    const newA=new Audio(fullAudioUrl);
    newA.addEventListener('loadedmetadata',()=>{
      const seekTo=Math.min(curT,newA.duration-1);
      if(seekTo>0)newA.currentTime=seekTo;
      if(audio){audio.pause();audio.src='';URL.revokeObjectURL(audioUrl)}
      audio=newA;audioUrl=fullAudioUrl;
      audio.addEventListener('timeupdate',onTimeUpdate);
      audio.addEventListener('ended',onEnded);
      const totT=document.getElementById('totTime');
      totT.textContent=formatTime(audio.duration);
      if(wasPlaying){audio.play().catch(()=>{});document.getElementById('playBtn').textContent='⏸'}
    });
  }catch(e){console.warn('Full audio error:',e)}
}

// ============ PLAYER ============
let audio=null,isPlaying=false,activeIdx=-1;
let timings=[];
let simTimer=null;

function showPlayer(){
  showPage('pagePlayer');
  initPlayer();
}
function backHome(){
  if(audio){audio.pause();audio=null}
  if(simTimer)clearInterval(simTimer);
  if(pollTimer)clearInterval(pollTimer);
  if(speakInt)clearInterval(speakInt);
  showPage('pageInput');
}

function initPlayer(){
  // Build dialogue list (if script data available)
  const list=document.getElementById('lineList');
  list.innerHTML='';
  if(scriptData&&Array.isArray(scriptData)){
    scriptData.forEach((item,i)=>{
      const d=document.createElement('div');
      d.className='line-item';d.dataset.index=i;
      d.innerHTML='<span class="line-speaker '+item.speaker+'">'+item.speaker+'</span><span class="line-text">'+item.text+'</span>';
      list.appendChild(d);
    });
    // Calculate timings
    timings=[];let acc=0;
    scriptData.forEach(item=>{const d=Math.max(1.5,item.text.length/4);timings.push({start:acc,end:acc+d});acc+=d});
  }else{
    // Opening-only mode: show placeholder
    const d=document.createElement('div');
    d.className='line-item';
    d.innerHTML='<span class="line-text" style="color:var(--text2)">开场已就绪，完整文稿加载中…</span>';
    list.appendChild(d);
    timings=[];
  }

  // Setup audio
  if(audio){audio.pause()}
  audio=new Audio(audioUrl);
  const totT=document.getElementById('totTime');
  audio.addEventListener('loadedmetadata',()=>{totT.textContent=formatTime(audio.duration)});
  audio.addEventListener('timeupdate',onTimeUpdate);
  audio.addEventListener('ended',onEnded);
  audio.addEventListener('error',(e)=>{
    console.log('Audio error, using simulation');
    if(!audio.src||audio.error)startSimulation();
  });

  // If audio never loads metadata, use estimate
  setTimeout(()=>{
    if(!audio.duration)totT.textContent=formatTime(acc);
  },2000);

  // Controls
  document.getElementById('playBtn').onclick=togglePlay;
  document.getElementById('rewindBtn').onclick=()=>{if(audio.currentTime)audio.currentTime=Math.max(0,audio.currentTime-15)};
  document.getElementById('forwardBtn').onclick=()=>{if(audio.currentTime)audio.currentTime=Math.min(audio.duration||acc,audio.currentTime+15)};

  // Progress seek
  const pw=document.getElementById('progressWrap');
  pw.onmousedown=pw.ontouchstart=function(e){
    const rect=pw.getBoundingClientRect();
    const x=e.touches?e.touches[0].clientX:e.clientX;
    const p=Math.max(0,Math.min(1,(x-rect.left)/rect.width));
    document.getElementById('progressFill').style.width=(p*100)+'%';
    if(audio.duration){audio.currentTime=p*audio.duration}
    curTime.textContent=formatTime(p*(audio.duration||acc));
    const onMove=(e)=>{
      const x2=e.touches?e.touches[0].clientX:e.clientX;
      const p2=Math.max(0,Math.min(1,(x2-rect.left)/rect.width));
      document.getElementById('progressFill').style.width=(p2*100)+'%';
      if(audio.duration)audio.currentTime=p2*audio.duration;
      curTime.textContent=formatTime(p2*(audio.duration||acc));
    };
    const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);document.removeEventListener('touchmove',onMove);document.removeEventListener('touchend',onUp)};
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    document.addEventListener('touchmove',onMove,{passive:true});document.addEventListener('touchend',onUp);
  };
}

function togglePlay(){
  if(!audio)return;
  if(isPlaying){
    audio.pause();
    document.getElementById('playBtn').textContent='▶';
    stopAvatarAnim();
  }else{
    audio.play().catch(()=>startSimulation());
    document.getElementById('playBtn').textContent='⏸';
    startPlayerAvatarAnim();
  }
  isPlaying=!isPlaying;
}

function onTimeUpdate(){
  if(!audio.duration)return;
  const p=(audio.currentTime/audio.duration)*100;
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('curTime').textContent=formatTime(audio.currentTime);
  if(scriptData)updateHighlight(audio.currentTime);
}

function onEnded(){
  isPlaying=false;
  document.getElementById('playBtn').textContent='▶';
  stopAvatarAnim();
  loadRecommendations();
}

function updateHighlight(time){
  if(!scriptData||!timings.length)return;
  const idx=timings.findIndex(t=>time>=t.start&&time<t.end);
  if(idx===activeIdx||idx<0)return;
  activeIdx=idx;
  document.querySelectorAll('.line-item').forEach((el,i)=>{
    el.classList.toggle('active',i===idx);
    if(i===idx)el.scrollIntoView({behavior:'smooth',block:'center'});
  });
  const sp=scriptData[idx].speaker;
  document.getElementById('pAv1').classList.toggle('speaking',sp==='小羊');
  document.getElementById('pAv2').classList.toggle('speaking',sp==='小姜');
  document.getElementById('pName1').textContent=sp==='小羊'?'小羊 ◀':'小羊';
  document.getElementById('pName2').textContent=sp==='小姜'?'小姜 ◀':'小姜';
}

function startSimulation(){
  if(simTimer)return;
  const total=timings.length?timings[timings.length-1].end:120;
  let t=0;
  simTimer=setInterval(()=>{
    t+=0.1;
    if(t>=total){clearInterval(simTimer);simTimer=null;isPlaying=false;document.getElementById('playBtn').textContent='▶';stopAvatarAnim();return}
    const p=(t/total)*100;
    document.getElementById('progressFill').style.width=p+'%';
    document.getElementById('curTime').textContent=formatTime(t);
    updateHighlight(t);
  },100);
}

let pSpeakInt=null;
function startPlayerAvatarAnim(){
  let s=false;
  pSpeakInt=setInterval(()=>{s=!s;document.getElementById('pAv1').classList.toggle('speaking',s);document.getElementById('pAv2').classList.toggle('speaking',!s)},1200);
}
function stopAvatarAnim(){
  if(pSpeakInt)clearInterval(pSpeakInt);pSpeakInt=null;
  document.getElementById('pAv1').classList.remove('speaking');
  document.getElementById('pAv2').classList.remove('speaking');
}

function formatTime(s){
  if(!s||isNaN(s))return'00:00';
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// ============ RECOMMENDATIONS ============

async function loadRecommendations(){
  const section=document.getElementById('recommendSection');
  const list=document.getElementById('recList');
  if(!recContent&&!recTitle){section.classList.remove('show');return}
  try{
    const r=await fetch(BASE+'/recommend',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:recTitle,content:recContent})
    });
    if(!r.ok)return;
    const d=await r.json();
    if(!d.recommendations||!d.recommendations.length){section.classList.remove('show');return}
    list.innerHTML='';
    d.recommendations.forEach(item=>{
      const card=document.createElement('div');
      card.className='rec-card';
      card.innerHTML='<div class="rec-card-title">'+item.title+'</div><div class="rec-card-summary">'+item.summary+'</div><span class="rec-card-badge">相似度 '+(item.similarity*100).toFixed(0)+'%</span>';
      card.addEventListener('click',()=>onRecClick(item));
      list.appendChild(card);
    });
    section.classList.add('show');
  }catch(e){console.warn('Recommend error:',e)}
}

function onRecClick(item){
  showToast('加载推荐文章…');
  backHome();
  if(item.url){
    document.querySelector('[data-mode="url"]').click();
    document.getElementById('urlInput').value=item.url;
  }else{
    document.querySelector('[data-mode="text"]').click();
    document.getElementById('textInput').value=item.title+'\n\n'+item.summary;
  }
}

// ============ TOAST ============
let tt;
function showToast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2200)}
</script>
